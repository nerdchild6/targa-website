<div class="three-D-hover-car-carousel">
  <!-- Main Card Code -->
  <div class="three-D-hover-car-carousel-card">
    <!-- Cover image Code -->
    <div class="three-D-hover-car-carousel-wrapper">
      <img
        src="https://targacar.com/wp-content/uploads/card-scaled.jpeg"
        class="three-D-hover-car-carousel-cover-image"
      />
    </div>

    <!-- Logo Code -->
    <img
      src="https://targacar.com/wp-content/uploads/popup-1.png"
      class="three-D-hover-car-carousel-logo"
    />

    <!-- Character image Code -->
    <img
      src="https://targacar.com/wp-content/uploads/text-1.png"
      class="three-D-hover-car-carousel-character"
    />

    <!-- Price Tag Code -->
    <div class="three-D-hover-car-carousel-price-tag">
      <span class="three-D-hover-car-carousel-currency">฿</span>
      <span class="three-D-hover-car-carousel-amount">99,999</span>
      <span class="three-D-hover-car-carousel-per-day">/ day</span>
    </div>
  </div>
</div>
