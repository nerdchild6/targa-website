<script>
  window.addEventListener("load", function () {
    const urlParams = new URLSearchParams(window.location.search);

    // 1. Define the Filter Configuration Map
    // This array binds the URL query parameter keys to their specific PXL DOM selectors.
    const requestedFilters = [];

    const brandParam = urlParams.get("brand");
    if (brandParam) {
      requestedFilters.push({
        value: brandParam,
        selector: 'input.vehicle-brands[type="checkbox"]',
      });
    }

    const categoryParam = urlParams.get("vehicleCategories");
    if (categoryParam) {
      // NOTE: Ensure 'vehicle-category' is the exact class generated by PXL.
      // Sometimes it is pluralized as 'vehicle-categories'.
      requestedFilters.push({
        value: categoryParam,
        selector: 'input.vehicle-category[type="checkbox"]',
      });
    }

    // Terminate execution early if no valid parameters exist in the URI
    if (requestedFilters.length === 0) return;

    // 2. Unified DOM Polling Mechanism
    const maxRetries = 40;
    let attempts = 0;

    const hydrationInterval = setInterval(() => {
      attempts++;

      // Check if the primary PXL wrapper has rendered to confirm DOM readiness
      const filterWrapperRendered = document.querySelector(
        '.pxl-car-filter, [data-widget_type*="pxl_car_filter"]',
      );

      if (filterWrapperRendered) {
        clearInterval(hydrationInterval);

        // 3. Asynchronous Execution Buffer (800ms to allow PXL jQuery bindings)
        setTimeout(() => {
          let scrollTarget = null;

          // 4. Iterate over all requested filters dynamically
          requestedFilters.forEach((filter) => {
            const checkboxes = document.querySelectorAll(filter.selector);

            for (const checkbox of checkboxes) {
              const label = checkbox.closest("label");

              if (label && label.textContent.trim() === filter.value) {
                // Inject synthetic interaction if not already active
                if (!label.classList.contains("active")) {
                  label.click();
                }

                // Capture the first matched label's container for the UI scroll execution
                if (!scrollTarget) {
                  scrollTarget = label.closest(
                    "div.pxl-car-listing-wg, ul.list-item",
                  );
                }
                break; // Terminate inner loop once the specific filter node is mutated
              }
            }
          });

          // 5. Execute a single scroll event after all filters are applied
          if (scrollTarget) {
            scrollTarget.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 800);
      } else if (attempts >= maxRetries) {
        clearInterval(hydrationInterval);
        console.error(
          "PXL Filter Hydration Timeout: The filter widget failed to mount to the DOM.",
        );
      }
    }, 250);
  });
</script>
