<style>
  /* Targets the Pxl Car Filter component globally on this specific page */
  .elementor-widget-pxl_car_filter {
    display: none !important;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Extract and normalize the URI path (strips trailing slashes for safe matching)
    const currentPath = window.location.pathname.replace(/\/$/, "");

    // 2. Define your Route to Taxonomy ID map
    const routeMap = {
      "/convertible": "126",
      // Add future landing page routes here:
      // '/landingLuxury': '127',
      // '/landingSupercar': '128'
    };

    // 3. Check if the current path exists in our routing map
    const targetTermId = routeMap[currentPath];

    if (targetTermId) {
      // 4. Execution buffer: Allow PXL scripts to bind their AJAX event listeners to the DOM
      setTimeout(() => {
        // Safely inject the mapped term ID into the query selector
        const checkboxNode = document.querySelector(
          `input.vehicle-category[type="checkbox"][value="${targetTermId}"]`,
        );

        if (checkboxNode) {
          // Traverse up the DOM tree to find the parent label and dispatch the click event
          const targetLabel = checkboxNode.closest("label");

          if (targetLabel) {
            targetLabel.click();
          } else {
            console.warn(
              `Architectural Warning: Label wrapper not found for checkbox value [${targetTermId}]. Check Elementor DOM structure.`,
            );
          }
        } else {
          console.warn(
            `Architectural Warning: Filter node for value [${targetTermId}] not present in the DOM.`,
          );
        }
      }, 300); // 300ms delay ensures asynchronous PXL widget initialization is complete
    }
  });
</script>
