<!-- Semantic HTML5 Structure -->
<section class="rcms-fleet-container" aria-labelledby="rcms-section-title">
  <header class="rcms-fleet-header">
    <div class="rcms-title-wrapper">
      <span class="rcms-subtitle">SELECTION</span>
      <h2 id="rcms-section-title" class="rcms-title">The Fleet</h2>
    </div>
    <nav class="rcms-filters" aria-label="Fleet Category Filters">
      <button
        class="rcms-filter-btn active"
        data-filter="all"
        aria-pressed="true"
      >
        VAN
      </button>
      <!-- Additional filters can be injected here for Polylang localized output -->
    </nav>
  </header>

  <!-- The DOM tree is injected dynamically via the JS templating engine -->
  <div
    class="rcms-fleet-layout"
    id="rcms-fleet-layout"
    role="region"
    aria-live="polite"
  ></div>
</section>

<!-- Hardware-Accelerated CSS Architecture -->
<style>
  :root {
    --rcms-bg: #f7f6f4;
    --rcms-text-dark: #1a1a1a;
    --rcms-text-light: #888888;
    --rcms-accent: #b3855a;
    --rcms-card-bg: #ffffff;
    --rcms-btn-bg: #e9e9e9;
    --rcms-btn-hover: #d4d4d4;
    --rcms-transition-standard: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .rcms-fleet-container {
    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
    background-color: var(--rcms-bg);
    /* Mobile-first base padding: Increased all-side spatial buffer for handhelds */
    padding: 3.5rem 2rem;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  .rcms-fleet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 3rem;
    flex-wrap: wrap;
    gap: 1.5rem;
    max-width: 1400px;
    margin-inline: auto;
  }

  .rcms-subtitle {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--rcms-accent);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .rcms-title {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 800;
    color: var(--rcms-text-dark);
    margin: 0;
    line-height: 1.1;
  }

  .rcms-filters {
    display: flex;
    gap: 1.5rem;
  }

  .rcms-filter-btn {
    background: transparent !important;
    border: none;
    border-radius: 0%;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--rcms-text-light);
    padding: 0 0 0.25rem 0;
    border-bottom: 2px solid transparent;
    transition:
      color var(--rcms-transition-standard),
      border-color var(--rcms-transition-standard);
    text-transform: uppercase;
    cursor: default !important; /* Force override of Elementor global button styles */
  }

  .rcms-filter-btn.active,
  .rcms-filter-btn:hover {
    color: var(--rcms-text-dark);
    border-bottom-color: var(--rcms-text-dark);
  }

  /* Structural Layout Configuration: Optimized for Single/Low Inventory */
  .rcms-fleet-layout {
    display: flex;
    justify-content: center; /* Centers the single vehicle perfectly */
    align-items: stretch;
    flex-wrap: wrap; /* Graceful degradation for future inventory expansion via n8n */
    gap: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Breakpoints for horizontal padding expansion */
  @media (min-width: 768px) {
    .rcms-fleet-container {
      padding: 4rem 5vw;
    }
  }

  @media (min-width: 1024px) {
    .rcms-fleet-container {
      padding: 5rem 8vw;
    }
  }

  /* Card Component Architecture */
  .rcms-card {
    background-color: var(--rcms-card-bg);
    border-radius: 0.5rem;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);

    /* CRITICAL: Intrinsic Sizing Constraint */
    flex: 0 1 100%;
    max-width: 420px; /* Constrains the maximum footprint on desktop so it doesn't stretch */

    /* Strict adherence to transform/opacity for compositing layer optimization */
    transition:
      transform var(--rcms-transition-standard),
      opacity var(--rcms-transition-standard);
    will-change: transform, opacity;
    display: flex;
    flex-direction: column;
  }

  .rcms-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
  }

  .rcms-card.hidden {
    display: none;
  }

  /* CLS Prevention: Aspect Ratio enforcement */
  .rcms-card-image-wrapper {
    position: relative;
    width: 100%;
    padding-top: 66.66%; /* 3:2 Aspect Ratio */
    background-color: #eaeaea; /* Placeholder color while loading */
    overflow: hidden;
  }

  .rcms-card-image {
    position: absolute;
    top: 0;
    left: 0;
    /* Strict enforcement to bypass Elementor/WordPress default height:auto rules */
    width: 100% !important;
    height: 100% !important;
    max-height: none !important;
    object-fit: cover !important;
    display: block;
    transition: transform 0.7s ease;
  }

  .rcms-card:hover .rcms-card-image {
    transform: scale(1.03); /* Micro-interaction on image */
  }

  .rcms-card-content {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .rcms-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    gap: 1rem;
  }

  .rcms-car-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--rcms-text-dark);
    margin: 0;
    line-height: 1.3;
  }

  .rcms-price {
    font-weight: 700;
    color: var(--rcms-accent);
    text-align: right;
    white-space: nowrap;
  }

  .rcms-price-amount {
    font-size: 1.1rem;
  }

  .rcms-price-unit {
    font-size: 0.7rem;
    color: var(--rcms-text-light);
    text-transform: uppercase;
    display: block;
  }

  .rcms-specs {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    flex-grow: 1; /* Pushes button to bottom if titles span multiple lines */
  }

  .rcms-spec-item {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--rcms-text-light);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    text-transform: uppercase;
  }

  .rcms-reserve-btn {
    width: 100%;
    padding: 0.875rem;
    background-color: var(--rcms-btn-bg);
    color: var(--rcms-text-dark);
    border: none;
    border-radius: 0.375rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background-color var(--rcms-transition-standard);
    margin-top: auto;
  }

  .rcms-reserve-btn:hover {
    background-color: var(--rcms-btn-hover);
  }
</style>

<!-- Vanilla JS Data Model & Rendering Logic -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Data Schema: Ready for n8n API synchronization
    const fleetInventory = [
      {
        id: "Toyota ALPHARD30 van",
        title: "Toyota ALPHARD30",
        category: "van",
        price: "3,900 THB",
        image: "https://targacar.com/wp-content/uploads/8-1-scaled.jpg",
        postUrl: "/cars/toyota-alphard30/",
        specs: [
          { icon: "⚙️", text: "AUTOMATIC" },
          { icon: "⚡", text: "182 HP" },
          { icon: "👤", text: "7 SEATS" },
        ],
      },
    ];

    const layoutContainer = document.getElementById("rcms-fleet-layout");

    // Templating Engine: Upgraded to semantic HTML5 <article> tags
    function renderFleetLayout(inventoryData) {
      // Create a DocumentFragment to minimize reflows during bulk DOM insertion
      const fragment = document.createDocumentFragment();
      const tempDiv = document.createElement("div");

      // Note: Removed loading="lazy" and added fetchpriority="high" for LCP optimization
      // since this single item acts as the primary visual component.
      tempDiv.innerHTML = inventoryData
        .map(
          (vehicle) => `
        <article class="rcms-card" data-category="${vehicle.category}">
          <div class="rcms-card-image-wrapper">
            <img src="${vehicle.image}" alt="Rent ${vehicle.title} in Thailand" class="rcms-card-image" fetchpriority="high" width="600" height="400" />
          </div>
          <div class="rcms-card-content">
            <header class="rcms-card-header">
              <h3 class="rcms-car-title">${vehicle.title}</h3>
              <div class="rcms-price">
                <span class="rcms-price-amount">${vehicle.price}</span>
                <span class="rcms-price-unit">/ DAY</span>
              </div>
            </header>
            <div class="rcms-specs" aria-label="Vehicle Specifications">
              ${vehicle.specs
                .map(
                  (spec) => `
                <div class="rcms-spec-item">
                  <span aria-hidden="true">${spec.icon}</span> 
                  <span>${spec.text}</span>
                </div>
              `,
                )
                .join("")}
            </div>
            <button class="rcms-reserve-btn" data-vehicle-id="${vehicle.id}" data-vehicle-title="${vehicle.title}" data-post-url="${vehicle.postUrl}" aria-label="Proceed to reserve ${vehicle.title}">
              CLICK TO RESERVE
            </button>
          </div>
        </article>
      `,
        )
        .join("");

      while (tempDiv.firstChild) {
        fragment.appendChild(tempDiv.firstChild);
      }
      layoutContainer.appendChild(fragment);
    }

    // Initialization Sequence
    renderFleetLayout(fleetInventory);

    // Event Delegation: Hardware-accelerated category filtering
    const filterContainer = document.querySelector(".rcms-filters");
    if (filterContainer) {
      filterContainer.addEventListener("click", (e) => {
        if (!e.target.classList.contains("rcms-filter-btn")) return;

        // Manage ARIA state and visual active classes
        document.querySelectorAll(".rcms-filter-btn").forEach((btn) => {
          btn.classList.remove("active");
          btn.setAttribute("aria-pressed", "false");
        });
        e.target.classList.add("active");
        e.target.setAttribute("aria-pressed", "true");

        const targetFilter = e.target.getAttribute("data-filter");
        const cards = document.querySelectorAll(".rcms-card");

        // Execute render pipeline utilizing opacity to maintain 60fps
        cards.forEach((card) => {
          const category = card.getAttribute("data-category");
          if (targetFilter === "all" || targetFilter === category) {
            card.classList.remove("hidden");
            // Micro-delay to ensure display:flex computes before opacity transition triggers
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                card.style.opacity = "1";
                card.style.transform = "scale(1)";
              });
            });
          } else {
            card.style.opacity = "0";
            card.style.transform = "scale(0.95)";
            setTimeout(() => card.classList.add("hidden"), 300); // Matches CSS transition duration
          }
        });
      });
    }

    // Event Delegation: Reservation Routing
    layoutContainer.addEventListener("click", (e) => {
      const reserveBtn = e.target.closest(".rcms-reserve-btn");
      if (reserveBtn) {
        const vehicleId = reserveBtn.getAttribute("data-vehicle-id");
        const vehicleTitle = reserveBtn.getAttribute("data-vehicle-title");
        const postUrl = reserveBtn.getAttribute("data-post-url");
        triggerReservation(vehicleId, vehicleTitle, postUrl);
      }
    });
  });

  // Routing subroutine optimized for WordPress Permalinks
  function triggerReservation(id, title, targetUrl) {
    console.info(`[RCMS DOM Event] Routing initialized for entity: ${id}`);
    if (targetUrl) {
      window.location.href = targetUrl;
    } else {
      console.error(
        `[RCMS Architectural Exception] Routing parameter missing for dataset: ${title}. Verify Polylang synchronization.`,
      );
    }
  }
</script>
