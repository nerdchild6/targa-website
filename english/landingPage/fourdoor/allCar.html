<!-- HTML Structure -->
<div class="rcms-fleet-container">
  <div class="rcms-fleet-header">
    <div class="rcms-title-wrapper">
      <span class="rcms-subtitle">SELECTION</span>
      <h2 class="rcms-title">The Fleet</h2>
    </div>
    <div class="rcms-filters">
      <button class="rcms-filter-btn active" data-filter="all">
        CONVERTIBLE
      </button>
    </div>
  </div>

  <!-- The grid is now injected dynamically via JavaScript -->
  <div class="rcms-fleet-grid" id="rcms-fleet-grid"></div>
</div>

<!-- CSS Styling -->
<style>
  :root {
    --rcms-bg: #f7f6f4;
    --rcms-text-dark: #1a1a1a;
    --rcms-text-light: #888888;
    --rcms-accent: #b3855a;
    --rcms-card-bg: #ffffff;
    --rcms-btn-bg: #e9e9e9;
    --rcms-btn-hover: #d4d4d4;
  }

  .rcms-fleet-container {
    font-family:
      "Inter",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
    background-color: var(--rcms-bg);
    padding: 40px 20px;
    margin: 0 auto;
  }

  .rcms-fleet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 20px;
    padding: 0 7rem;
  }

  .rcms-subtitle {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--rcms-accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .rcms-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--rcms-text-dark);
    margin: 0;
    line-height: 1;
  }

  .rcms-filters {
    display: flex;
    gap: 24px;
  }

  .rcms-filter-btn {
    background: none !important;
    border: none;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--rcms-text-light);
    padding: 0 0 4px 0;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    text-transform: uppercase;
    border-radius: 0;
    pointer-events: none;
  }

  .rcms-filter-btn.active {
    color: var(--rcms-text-dark);
  }

  .rcms-filter-btn.active {
    border-bottom-color: var(--rcms-text-dark);
  }

  .rcms-fleet-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
    max-width: 75vw;
    margin: 0 auto;
  }

  /* Staggered Column Architecture */
  @media (min-width: 769px) {
    .rcms-fleet-grid {
      /* Padding prevents the translated row from clipping the container boundaries */
      padding-bottom: 60px;
    }
    .rcms-card:nth-child(even) {
      transform: translateY(60px);
    }
    .rcms-card:nth-child(even):hover {
      /* Accounts for the base translation offset minus the hover lift */
      transform: translateY(55px);
    }
  }

  @media (max-width: 768px) {
    .rcms-fleet-grid {
      grid-template-columns: 1fr;
    }
    .rcms-fleet-header {
      flex-direction: column;
      align-items: flex-start;
      padding: 0;
    }
  }

  .rcms-card {
    background-color: var(--rcms-card-bg);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    transition:
      transform 0.3s ease,
      opacity 0.4s ease;
  }

  .rcms-card:hover {
    transform: translateY(-5px);
  }

  .rcms-card.hidden {
    display: none;
  }

  .rcms-card-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
  }

  .rcms-card-content {
    padding: 24px;
  }

  .rcms-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }

  .rcms-car-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--rcms-text-dark);
    margin: 0;
  }

  .rcms-price {
    font-weight: 700;
    color: var(--rcms-accent);
  }

  .rcms-price-amount {
    font-size: 1.1rem;
  }

  .rcms-price-unit {
    font-size: 0.7rem;
    color: var(--rcms-text-light);
    text-transform: uppercase;
  }

  .rcms-specs {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .rcms-spec-item {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--rcms-text-light);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }

  .rcms-reserve-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--rcms-btn-bg);
    color: var(--rcms-text-dark);
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .rcms-reserve-btn:hover {
    background-color: var(--rcms-btn-hover);
  }
</style>

<!-- Vanilla JS Data Model & Rendering Logic -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Data Schema: Prepares for future API/n8n integration
    // Added 'postUrl' parameter to manage WordPress post routing
    const fleetInventory = [
      {
        id: "BMW 3 Series 320d",
        title: "BMW 3 Series 320d",
        category: "4 door",
        price: "3,500 THB",
        image: "https://targacar.com/wp-content/uploads/DSC01960-scaled.jpg",
        postUrl: "/cars/bmw-3-series-320d/",
        specs: [
          { icon: "⚙️", text: "AUTOMATIC" },
          { icon: "⚡", text: "190 HP" },
          { icon: "👤", text: "5 SEATS" },
        ],
      },
      {
        id: "BMW 320d M Sport LCI",
        title: "BMW 320d M Sport LCI",
        category: "4 door",
        price: "4,500 THB",
        image:
          "https://targacar.com/wp-content/uploads/LINE_ALBUM_320d_250506_6.jpg",
        postUrl: "/cars/bmw-320d-m-sport-lci/",
        specs: [
          { icon: "⚙️", text: "AUTOMATIC" },
          { icon: "⚡", text: "190 HP" },
          { icon: "👤", text: "5 SEATS" },
        ],
      },
      {
        id: "Audi A5 40 TSFI Coupe",
        title: "Audi A5 40 TSFI Coupe",
        category: "4 door",
        price: "3,500 THB",
        image:
          "https://targacar.com/wp-content/uploads/7A1915D5-532E-4223-850D-B983784DC5FF.jpeg",
        postUrl: "/cars/audi-a5-40-tsfi-coupe/",
        specs: [
          { icon: "⚙️", text: "AUTOMATIC" },
          { icon: "⚡", text: "190 HP" },
          { icon: "👤", text: "4 SEATS" },
        ],
      },
      {
        id: "Mercedes-Benz CLE300 4MATIC",
        title: "Mercedes-Benz CLE300 4MATIC",
        category: "4 door",
        price: "8,900 THB",
        image:
          "https://targacar.com/wp-content/uploads/CEF4C795-F969-4AA5-9C15-719F26BBFB05.jpeg",
        postUrl: "/cars/mercedes-benz/",
        specs: [
          { icon: "⚙️", text: "AUTOMATIC" },
          { icon: "⚡", text: "255 HP" },
          { icon: "👤", text: "4 SEATS" },
        ],
      },
    ];

    const gridContainer = document.getElementById("rcms-fleet-grid");

    // Templating Engine
    function renderFleetGrid(inventoryData) {
      gridContainer.innerHTML = inventoryData
        .map(
          (vehicle) => `
        <div class="rcms-card" data-category="${vehicle.category}">
          <img src="${vehicle.image}" alt="${vehicle.title}" class="rcms-card-image" />
          <div class="rcms-card-content">
            <div class="rcms-card-header">
              <h3 class="rcms-car-title">${vehicle.title}</h3>
              <div class="rcms-price">
                <span class="rcms-price-amount">${vehicle.price}</span>
                <span class="rcms-price-unit">/ DAY</span>
              </div>
            </div>
            <div class="rcms-specs">
              ${vehicle.specs
                .map(
                  (spec) => `
                <div class="rcms-spec-item">${spec.icon} ${spec.text}</div>
              `,
                )
                .join("")}
            </div>
            <button class="rcms-reserve-btn" data-vehicle-id="${vehicle.id}" data-vehicle-title="${vehicle.title}" data-post-url="${vehicle.postUrl}">
              CLICK TO RESERVE
            </button>
          </div>
        </div>
      `,
        )
        .join("");
    }

    // Initialize Grid Render
    renderFleetGrid(fleetInventory);

    // Event Delegation: Filtering
    const filterContainer = document.querySelector(".rcms-filters");
    if (filterContainer) {
      filterContainer.addEventListener("click", (e) => {
        if (!e.target.classList.contains("rcms-filter-btn")) return;

        // Update UI active state
        document
          .querySelectorAll(".rcms-filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        e.target.classList.add("active");

        // Execute Filter
        const targetFilter = e.target.getAttribute("data-filter");
        const cards = document.querySelectorAll(".rcms-card");

        cards.forEach((card) => {
          const category = card.getAttribute("data-category");
          if (targetFilter === "all" || targetFilter === category) {
            card.classList.remove("hidden");
            setTimeout(() => (card.style.opacity = "1"), 10);
          } else {
            card.style.opacity = "0";
            setTimeout(() => card.classList.add("hidden"), 300);
          }
        });
      });
    }

    // Event Delegation: Reservation Trigger
    gridContainer.addEventListener("click", (e) => {
      if (e.target.classList.contains("rcms-reserve-btn")) {
        const vehicleId = e.target.getAttribute("data-vehicle-id");
        const vehicleTitle = e.target.getAttribute("data-vehicle-title");
        const postUrl = e.target.getAttribute("data-post-url");
        triggerReservation(vehicleId, vehicleTitle, postUrl);
      }
    });
  });

  // Subroutine for downstream logic (n8n routing, URL params, etc.)
  function triggerReservation(id, title, targetUrl) {
    console.log(
      `[RCMS Event] Navigating to reservation post. ID: ${id}, Target: ${targetUrl}`,
    );

    // Document Object Model relocation execution
    if (targetUrl) {
      window.location.href = targetUrl;
    } else {
      console.warn(
        `[RCMS Error] No valid routing parameter found for ${title}`,
      );
    }
  }
</script>
