<section class="targa-gallery-section">
  <div class="targa-process-header">
    <span class="targa-process-header__overline">The Fleet</span>
    <h2 class="targa-process-header__title">Signatures of Excellence</h2>
  </div>

  <!-- Carousel Viewport -->
  <div class="targa-carousel-viewport">
    <div class="targa-carousel-track" id="targaGalleryTrack">
      <!-- JavaScript will inject cards here -->
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="targa-carousel-controls">
    <button
      class="targa-nav-btn"
      id="targaPrevBtn"
      aria-label="Previous Vehicle"
    >
      ❮
    </button>
    <button class="targa-nav-btn" id="targaNextBtn" aria-label="Next Vehicle">
      ❯
    </button>
  </div>
</section>

<style>
  /* --- Foundation & Header --- */
  .targa-gallery-section {
    background-color: #f9f5f3;
    padding: 5rem 1rem;
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
    overflow: hidden;
  }

  .targa-process-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 4rem;
  }
  .targa-process-header__overline {
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c0824b;
    margin-bottom: 1rem;
  }
  .targa-process-header__title {
    font-size: clamp(2rem, 4vw, 3.5rem);
    font-weight: 800;
    color: #1a1a1a;
    margin: 0;
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  /* --- Carousel Viewport & Grid Track --- */
  .targa-carousel-viewport {
    max-width: 1200px;
    margin: 0 auto;
    overflow: visible;
    position: relative;
    padding-bottom: 4rem; /* Accommodate offset */
  }

  .targa-carousel-track {
    display: grid;
    grid-template-areas: "track";
    width: 100%;
  }

  /* --- Dynamic Card Container Logic --- */
  .targa-card-container {
    grid-area: track;
    width: calc(33.333% - 1.5rem);
    margin: 0 auto;
    align-self: center; /* Crucial: Vertically centers cards of different natural heights */
    transition:
      transform 0.7s cubic-bezier(0.25, 1, 0.5, 1),
      opacity 0.7s ease;
    will-change: transform, opacity;
  }

  /* --- Premium Image Card Styling --- */
  .targa-showcase-card {
    background: #ffffff;
    padding: 1.5rem;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease;
    /* height: 100% removed to allow natural wrapping around the image */
  }

  /* Elevate the center card subtly on hover instead of scaling text */
  .targa-card-container.is-center .targa-showcase-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
  }

  .targa-showcase-card__stars {
    color: #9d5b2e;
    font-size: 1.25rem;
    letter-spacing: 0.15em;
    margin-bottom: 1.25rem;
    text-align: center;
  }

  /* --- Chat Screenshot Scrollable Wrapper --- */
  .targa-showcase-card__image-wrap {
    width: 100%;
    max-height: 60vh; /* Protects layout: limits height to 60% of viewport */
    border-radius: 8px;
    overflow-y: auto; /* Adds vertical scroll for long chats */
    overflow-x: hidden;
    position: relative;
    border: 1px solid #eaeaea; /* Provides a clean edge for white screenshots */

    /* Elegant Custom Scrollbar (Firefox) */
    scrollbar-width: thin;
    scrollbar-color: #c0824b #f4f4f4;
  }

  /* Elegant Custom Scrollbar (Webkit/Chrome/Safari) */
  .targa-showcase-card__image-wrap::-webkit-scrollbar {
    width: 6px;
  }
  .targa-showcase-card__image-wrap::-webkit-scrollbar-track {
    background: #f4f4f4;
    border-radius: 8px;
  }
  .targa-showcase-card__image-wrap::-webkit-scrollbar-thumb {
    background: #e0e0e0;
    border-radius: 8px;
    transition: background 0.3s;
  }
  .targa-showcase-card__image-wrap:hover::-webkit-scrollbar-thumb {
    background: #c0824b; /* Highlights scrollbar when user interacts */
  }

  .targa-showcase-card__image-wrap img {
    width: 100%;
    height: auto; /* Allows natural proportional scaling */
    display: block;
    /* object-fit properties and hover scaling removed to maintain text readability */
  }

  /* --- JavaScript State Classes --- */
  .targa-card-container.is-center {
    transform: translateX(0) translateY(0);
    opacity: 1;
    z-index: 3;
  }

  .targa-card-container.is-left {
    transform: translateX(calc(-100% - 2.25rem)) translateY(3rem);
    opacity: 0.5;
    z-index: 2;
    cursor: pointer;
  }

  .targa-card-container.is-right {
    transform: translateX(calc(100% + 2.25rem)) translateY(3rem);
    opacity: 0.5;
    z-index: 2;
    cursor: pointer;
  }

  .targa-card-container.is-hidden-left {
    transform: translateX(calc(-200% - 4.5rem)) translateY(3rem);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  .targa-card-container.is-hidden-right {
    transform: translateX(calc(200% + 4.5rem)) translateY(3rem);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* --- Navigation Controls --- */
  .targa-carousel-controls {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .targa-nav-btn {
    background: transparent;
    border: 2px solid #dcdcdc;
    color: #1a1a1a;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .targa-nav-btn:hover {
    border-color: #c0824b;
    color: #c0824b;
    background: #ffffff;
    box-shadow: 0 5px 15px rgba(192, 130, 75, 0.15);
  }

  /* --- Responsive Breakpoints --- */
  @media (max-width: 992px) {
    .targa-card-container {
      width: calc(50% - 1rem);
    }
    .targa-card-container.is-left {
      transform: translateX(calc(-100% - 2rem)) translateY(0);
      opacity: 0.4;
    }
    .targa-card-container.is-right {
      transform: translateX(calc(100% + 2rem)) translateY(0);
      opacity: 0.4;
    }
  }

  @media (max-width: 768px) {
    .targa-card-container {
      width: 85%;
    }
    .targa-showcase-card__image-wrap {
      max-height: 50vh; /* Slightly shorter on mobile devices for UX */
    }
    .targa-card-container.is-left {
      transform: translateX(-110%) translateY(0);
      opacity: 0;
    }
    .targa-card-container.is-right {
      transform: translateX(110%) translateY(0);
      opacity: 0;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Image-centric Data Payload
    const galleryData = [
      { image: "https://targacar.com/wp-content/uploads/2.jpg" },
      { image: "https://targacar.com/wp-content/uploads/3.jpg" },
      { image: "https://targacar.com/wp-content/uploads/4.jpg" },
      { image: "https://targacar.com/wp-content/uploads/5.jpg" },
      { image: "https://targacar.com/wp-content/uploads/6.jpg" },
      { image: "https://targacar.com/wp-content/uploads/7.jpg" },
      { image: "https://targacar.com/wp-content/uploads/8.jpg" },
      { image: "https://targacar.com/wp-content/uploads/9.jpg" },
      { image: "https://targacar.com/wp-content/uploads/10.jpg" },
      { image: "https://targacar.com/wp-content/uploads/11.jpg" },
      { image: "https://targacar.com/wp-content/uploads/1.jpg" },
    ];

    const track = document.getElementById("targaGalleryTrack");
    const btnPrev = document.getElementById("targaPrevBtn");
    const btnNext = document.getElementById("targaNextBtn");
    let currentIndex = 0;
    const total = galleryData.length;

    // 2. DOM Generation
    galleryData.forEach((item) => {
      const wrapper = document.createElement("div");
      wrapper.className = "targa-card-container";
      wrapper.innerHTML = `
        <div class="targa-showcase-card">
          <div class="targa-showcase-card__stars">★★★★★</div>
          <div class="targa-showcase-card__image-wrap">
            <img src="${item.image}" alt="Customer Review Screenshot" loading="lazy">
          </div>
        </div>
      `;
      track.appendChild(wrapper);
    });

    const cards = document.querySelectorAll(".targa-card-container");

    // 3. State Machine Engine
    const updateCarousel = () => {
      cards.forEach((card, index) => {
        let diff = (index - currentIndex + total) % total;
        card.className = "targa-card-container";

        if (diff === 0) {
          card.classList.add("is-center");
        } else if (diff === 1) {
          card.classList.add("is-right");
        } else if (diff === total - 1) {
          card.classList.add("is-left");
        } else if (diff === 2) {
          card.classList.add("is-hidden-right");
        } else {
          card.classList.add("is-hidden-left");
        }
      });
    };

    // 4. Controller Logic
    const nextSlide = () => {
      currentIndex = (currentIndex + 1) % total;
      updateCarousel();
    };
    const prevSlide = () => {
      currentIndex = (currentIndex - 1 + total) % total;
      updateCarousel();
    };

    btnNext.addEventListener("click", nextSlide);
    btnPrev.addEventListener("click", prevSlide);

    cards.forEach((card, index) => {
      card.addEventListener("click", () => {
        if (card.classList.contains("is-left")) prevSlide();
        if (card.classList.contains("is-right")) nextSlide();
      });
    });

    // 5. Touch/Swipe Architecture
    let touchStartX = 0;
    let touchEndX = 0;

    track.addEventListener(
      "touchstart",
      (e) => {
        touchStartX = e.changedTouches[0].screenX;
      },
      { passive: true },
    );

    track.addEventListener(
      "touchend",
      (e) => {
        touchEndX = e.changedTouches[0].screenX;
        // Verify user didn't swipe purely vertically (scrolling the image) before sliding the carousel
        const yDiff = Math.abs(e.changedTouches[0].screenY - touchStartX);
        const xDiff = Math.abs(touchEndX - touchStartX);

        if (xDiff > yDiff) {
          handleSwipe();
        }
      },
      { passive: true },
    );

    const handleSwipe = () => {
      const threshold = 50;
      if (touchEndX < touchStartX - threshold) nextSlide();
      if (touchEndX > touchStartX + threshold) prevSlide();
    };

    // Initialize
    updateCarousel();
  });
</script>
