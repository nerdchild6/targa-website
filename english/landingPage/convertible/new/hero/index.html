<style>
  /* Component-Scoped Variables */
  :root {
    --vlc-primary: #cf7321;
    --vlc-primary-hover: #b56219;
    --vlc-text-dark: #1a1a1a;
    --vlc-text-muted: #666666;
    --vlc-bg-secondary: #e5e5e5;
    --vlc-bg-secondary-hover: #d4d4d4;
    --vlc-font-sans:
      system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
  }

  /* Wrapper & Container */
  .vlc-hero-wrapper {
    position: relative;
    background-color: #fcf9f7;
    overflow: hidden;
    padding: 6rem 1rem;
    font-family: var(--vlc-font-sans);
    min-height: 800px;
    min-width: 100% !important;
    margin: 0 !important;
  }

  .vlc-hero-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    gap: 4rem;
    position: relative;
    z-index: 10;
  }

  @media (min-width: 768px) {
    .vlc-hero-container {
      flex-direction: row;
      gap: 2rem;
    }

    .vlc-hero-wrapper {
      padding: 6rem 1rem;
    }
  }

  /* Watermark */
  .vlc-hero-watermark {
    position: absolute;
    bottom: 10%;
    right: 10%;
    font-size: clamp(15rem, 10vw, 25rem);
    font-weight: 800;
    color: #f2f2f2;
    line-height: 0.8;
    z-index: 1;
    user-select: none;
    pointer-events: none;
  }

  /* Content Node */
  .vlc-hero-content {
    flex: 1;
    max-width: 500px;
    z-index: 2;
  }

  .vlc-hero-kicker {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--vlc-primary);
    margin-bottom: 1rem;
  }

  .vlc-hero-title {
    font-size: clamp(3rem, 5vw, 4.5rem);
    font-weight: 800;
    line-height: 1.1;
    color: var(--vlc-text-dark);
    margin: 0 0 1.5rem 0;
    letter-spacing: -0.02em;
  }

  .vlc-highlight {
    color: var(--vlc-primary);
    font-style: italic;
  }

  .vlc-hero-description {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--vlc-text-muted);
    margin-bottom: 2.5rem;
  }

  /* Button Cluster */
  .vlc-hero-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .vlc-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.875rem 1.75rem;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    border: none;
    text-decoration: none !important;
    transition:
      background-position 0.4s ease,
      transform 0.3s ease,
      box-shadow 0.3s ease,
      background-color 0.3s ease;
  }

  .vlc-btn-primary {
    background: linear-gradient(
      to right,
      #9b4c03 0%,
      #e7802d 50%,
      #9b4c03 100%
    ) !important;
    background-size: 200% auto !important;
    color: #ffffff !important;
    box-shadow: 0 10px 20px rgba(207, 115, 33, 0.2);
  }

  .vlc-btn-primary:hover {
    transform: scale(1.1);
    background-position: right center !important;
    box-shadow: 0 15px 25px rgba(207, 115, 33, 0.3);
  }

  .vlc-btn-secondary {
    background-color: var(--vlc-bg-secondary);
    color: var(--vlc-text-dark);
  }

  .vlc-btn-secondary:hover {
    background-color: var(--vlc-bg-secondary-hover);
    transform: translateY(-2px);
  }

  /* Visual Node */
  .vlc-hero-visual {
    flex: 1.2;
    position: relative;
    z-index: 2;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }

  .vlc-hero-image {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 12px;
    display: block;
  }
</style>

<div class="vlc-hero-wrapper">

      <div class="vlc-hero-actions">

        >
          Explore Fleet
        </a>
      </div>
    </div>

    <div class="vlc-hero-visual">
      <img

        loading="eager"
        fetchpriority="high"
      />
    </div>
  </div>
</div>
