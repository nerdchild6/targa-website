<style>
  /* --- Core Container Styles --- */
  .car-sync-carousel-container {
    width: 100%;
    position: relative;
    user-select: none; /* Prevent text selection during swipe */
  }

  .car-carousel-track {
    display: flex;
    overflow-x: auto; /* Allow horizontal scrolling (swipe) */
    scroll-snap-type: x mandatory; /* Snap to whole columns */
    width: 100%;
    gap: 10px; /* Adjust spacing between columns */
    scrollbar-width: none; /* Hide scrollbars for a clean look (Firefox) */
    position: relative;
  }

  .car-carousel-track::-webkit-scrollbar {
    display: none; /* Hide scrollbars for a clean look (Chrome/Safari) */
  }

  /* --- Navigation Arrow Buttons --- */
  .carousel-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  .carousel-nav-btn:hover {
    background: rgba(255, 215, 0, 0.9); /* Gold hover to match your brand */
    color: black;
    border-color: #ffd700;
  }

  .prev-btn {
    left: 15px;
  }

  .next-btn {
    right: 15px;
  }

  /* Hide arrows on touch devices (they will swipe instead) */
  @media (hover: none) and (pointer: coarse) {
    .carousel-nav-btn {
      display: none;
    }
  }

  /* --- Column Styles (Groups top and bottom images) --- */
  .car-column {
    flex: 0 0 calc((100% / 3) - (20px / 3)); /* 3 columns visible */
    scroll-snap-align: start; /* Snap at the beginning of the column */
    display: flex;
    flex-direction: column;
    gap: 10px; /* Gap between top and bottom cell */
  }

  /* Responsive Carousel Overrides */
  @media (max-width: 1024px) {
    .car-column {
      /* 2 Columns for Tablet */
      flex: 0 0 calc((100% / 2) - 5px) !important;
    }
  }
  @media (max-width: 768px) {
    .car-column {
      /* 1 Column for Mobile */
      flex: 0 0 100% !important;
    }
  }

  /* --- Individual Cell Styles --- */
  .car-cell {
    width: 100%;
    position: relative;
    background-size: cover;
    background-position: center;
    aspect-ratio: 4 / 3; /* Adjust to match the aspect ratio */
    border: 1px solid #222; /* Basic dark border */
    overflow: hidden;
    color: white;
    font-family: Arial, sans-serif;
    transition: transform 0.3s ease;
  }

  /* --- Cell Overlay (Logo/Brand/Text) --- */
  .car-cell::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.2) 0%,
      rgba(0, 0, 0, 0) 30%,
      rgba(0, 0, 0, 0) 70%,
      rgba(0, 0, 0, 0) 100%
    );
    z-index: 1;
    /* Hide the overlay completely if there is no text inside */
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  .car-cell.no-text::before {
    opacity: 0; /* Remove gradient overlay if no text is present */
  }

  .cell-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }

  .cell-top {
    text-align: center;
  }

  .cell-brand {
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 5px;
    font-weight: bold;
  }

  .cell-model {
    font-size: 12px;
    font-weight: lighter;
    margin-top: 2px;
    color: #ccc;
  }

  /* Basic styling when data is loading */
  .car-sync-carousel-container.loading {
    min-height: 400px;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 20px;
  }

  /* Optional hover effect */
  .car-cell:hover {
    transform: scale(1.02);
  }
</style>

<!-- MAIN HTML CONTAINER (Crucial: Do not delete) -->
<div id="pxl-luxury-carousel" class="car-sync-carousel-container loading">
  Loading Car Inventory...
</div>

<script>
  (function () {
    const carouselContainer = document.getElementById("pxl-luxury-carousel");
    const N8N_ENDPOINT_URL =
      "https://n8n.somsritshirt.com/webhook/33dd5373-6a65-424f-920c-dfaef4cb5482"; // Production URL

    // 1. Fetch data from n8n
    fetch(N8N_ENDPOINT_URL)
      .then((response) => {
        if (!response.ok)
          throw new Error(`HTTP error! status: ${response.status}`);
        return response.json();
      })
      .then((data) => {
        renderCarousel(data);
        setTimeout(initializeSynchronization, 100);
      })
      .catch((error) => {
        console.error("Error fetching data from n8n:", error);
        if (carouselContainer) {
          carouselContainer.innerHTML =
            "Error loading inventory. Please check n8n backend.";
          carouselContainer.classList.remove("loading");
        }
      });

    // 2. Render HTML based on data (Grouped by Column)
    function renderCarousel(carData) {
      carouselContainer.innerHTML = "";
      carouselContainer.classList.remove("loading");

      const row1Cars = carData.filter((car) => car.row === 1);
      const row2Cars = carData.filter((car) => car.row === 2);

      // Calculate total columns based on the row with the most cars
      const totalCols = Math.max(row1Cars.length, row2Cars.length);

      // Create main scrolling track
      const track = document.createElement("div");
      track.classList.add("car-carousel-track");

      for (let i = 0; i < totalCols; i++) {
        const colWrapper = document.createElement("div");
        colWrapper.classList.add("car-column");

        // Add Top cell if data exists for this index (Pass true to show text)
        if (row1Cars[i]) {
          colWrapper.appendChild(createCell(row1Cars[i], true));
        }

        // Add Bottom cell if data exists for this index (Pass false to hide text)
        if (row2Cars[i]) {
          colWrapper.appendChild(createCell(row2Cars[i], false));
        }

        track.appendChild(colWrapper);
      }

      carouselContainer.appendChild(track);

      // Create Navigation Arrows
      const leftBtn = document.createElement("button");
      leftBtn.classList.add("carousel-nav-btn", "prev-btn");
      leftBtn.innerHTML = "&#10094;"; // HTML entity for '<'
      leftBtn.setAttribute("aria-label", "Previous");

      const rightBtn = document.createElement("button");
      rightBtn.classList.add("carousel-nav-btn", "next-btn");
      rightBtn.innerHTML = "&#10095;"; // HTML entity for '>'
      rightBtn.setAttribute("aria-label", "Next");

      carouselContainer.appendChild(leftBtn);
      carouselContainer.appendChild(rightBtn);
    }

    // Helper to generate cell HTML
    function createCell(car, haveText) {
      const cell = document.createElement("div");
      cell.classList.add("car-cell");
      cell.style.backgroundImage = `url(${car.image})`;

      if (haveText) {
        cell.innerHTML = `
            <div class="cell-content">
                <div class="cell-top">
                    <div class="cell-brand">${car.brand}</div>
                    <div class="cell-model">${car.model}</div>
                </div>
            </div>
        `;
      } else {
        // Add a class so we can hide the dark gradient overlay if there's no text
        cell.classList.add("no-text");
      }

      return cell;
    }

    // 3. Autonomous Progression & Click Engine
    function initializeSynchronization() {
      const track = document.querySelector(".car-carousel-track");
      const prevBtn = document.querySelector(".prev-btn");
      const nextBtn = document.querySelector(".next-btn");

      if (!track) return;

      // INITIALIZATION: Set scroll position to the far right
      track.scrollLeft = track.scrollWidth;

      let autoScrollInterval;
      const AUTO_SCROLL_DELAY_MS = 4000;

      // Calculate dynamic step based on column size + gap
      const getScrollAmount = () => {
        const cols = track.querySelectorAll(".car-column");
        if (cols.length > 1) {
          return cols[1].offsetLeft - cols[0].offsetLeft;
        }
        return track.clientWidth / 3; // Fallback
      };

      // Action: Move View Left (Content moves right)
      const scrollLeftAction = () => {
        const scrollAmount = getScrollAmount();
        // If at left boundary, rewind to right
        if (track.scrollLeft <= 5) {
          track.scrollTo({ left: track.scrollWidth, behavior: "smooth" });
        } else {
          track.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        }
      };

      // Action: Move View Right (Content moves left)
      const scrollRightAction = () => {
        const scrollAmount = getScrollAmount();
        // If at right boundary, rewind to left
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 5) {
          track.scrollTo({ left: 0, behavior: "smooth" });
        } else {
          track.scrollBy({ left: scrollAmount, behavior: "smooth" });
        }
      };

      // Attach button events
      if (prevBtn) {
        prevBtn.addEventListener("click", () => {
          stopAutoScroll();
          scrollLeftAction();
          startAutoScroll(); // Restart timer to avoid double scroll
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          stopAutoScroll();
          scrollRightAction();
          startAutoScroll(); // Restart timer
        });
      }

      const startAutoScroll = () => {
        clearInterval(autoScrollInterval);
        // By default, auto-scroll shifts view left (content goes right)
        autoScrollInterval = setInterval(
          scrollLeftAction,
          AUTO_SCROLL_DELAY_MS,
        );
      };

      const stopAutoScroll = () => {
        clearInterval(autoScrollInterval);
      };

      // Initialize Autonomous loop
      startAutoScroll();

      // UX Safety Overrides (pause on hover/touch)
      carouselContainer.addEventListener("mouseenter", stopAutoScroll);
      carouselContainer.addEventListener("mouseleave", startAutoScroll);
      carouselContainer.addEventListener("touchstart", stopAutoScroll, {
        passive: true,
      });
      carouselContainer.addEventListener("touchend", startAutoScroll, {
        passive: true,
      });
    }
  })();
</script>
