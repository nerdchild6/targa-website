<style>
  /* 1. Global Reset & Main Container */
  .pxl-auto-rental-articles-container {
    --frame-border-radius: 12px; /* Softened for a premium automotive feel */
    --main-font-family: "Inter", Arial, sans-serif;
    --title-font-weight: 700;
    --item-font-weight: 500;
    --text-color-primary: #1a1a1a;
    --text-color-secondary: #5a5a5a;
    --column-spacing: 5vw; /* THE FIX: Fluid gap spacing */
    --row-spacing: 80px;
  }

  /* 2. Row Layout (Flexbox) */
  .pxl-rental-row {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: var(--column-spacing) !important;
    margin-bottom: var(--row-spacing) !important;
  }

  .pxl-rental-row.image-left {
    flex-direction: row !important;
  }

  .pxl-rental-row.content-left {
    flex-direction: row-reverse !important;
  }

  /* 3. Media & Content Column Basic Styles */
  .media-column {
    flex: 1 1 calc(50% - (var(--column-spacing) / 2)) !important;
    max-width: calc(50% - (var(--column-spacing) / 2)) !important;
    width: 100% !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }

  .content-column {
    flex: 1 1 calc(50% - (var(--column-spacing) / 2)) !important;
    max-width: calc(50% - (var(--column-spacing) / 2)) !important;
    width: 100% !important;

    font-family: var(--main-font-family) !important;
    color: var(--text-color-primary) !important;
  }

  /* 4. Viewport-Aware Media Suspenstion */
  .pxl-media-node {
    width: auto !important;
    max-width: 100% !important;
    height: auto !important;
    max-height: 75vh !important;
    display: block !important;
    border-radius: var(--frame-border-radius) !important;

    object-fit: contain !important;
    background-color: transparent !important;

    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08) !important;
    transition: transform 0.3s ease !important;
  }

  /* 5. Typography and Text Styling */
  .row-title {
    font-size: clamp(28px, 3vw, 36px) !important;
    font-weight: var(--title-font-weight) !important;
    margin-bottom: 25px !important;
    line-height: 1.2 !important;
    letter-spacing: -0.02em !important;
  }

  .details-list .list-item {
    margin-bottom: 20px !important;
    padding-left: 0 !important;
  }

  .list-item p {
    margin: 0 !important;
    padding: 0 !important;
    line-height: 1.5 !important;
  }

  .list-item .item-main {
    font-weight: var(--item-font-weight) !important;
    font-size: 20px !important;
    margin-bottom: 4px !important;
  }

  .list-item .item-desc {
    color: var(--text-color-secondary) !important;
    font-size: 16px !important;
  }

  /* 6. Breakpoints (Responsiveness) */
  @media (max-width: 991px) {
    .pxl-media-node {
      max-height: 60vh !important;
    }
  }

  /* MOBILE LAYOUT OVERRIDES */
  @media (max-width: 767px) {
    .pxl-rental-row {
      flex-direction: column !important;
      gap: 25px !important;
    }

    .media-column {
      /* Overrides the desktop 50% grid constraint */
      flex: 1 1 100% !important;
      width: 100% !important;
      max-width: 100% !important;

      /* THE FIX: Visually forces the media to the top of the stack */
      order: -1 !important;
    }

    .content-column {
      /* Overrides the desktop 50% grid constraint */
      flex: 1 1 100% !important;
      width: 100% !important;
      max-width: 100% !important;

      /* THE FIX: Visually forces the content below the media */
      order: 1 !important;
    }

    .pxl-media-node {
      max-height: 50vh !important;
      width: 100% !important;
    }
  }
</style>

<div class="pxl-auto-rental-articles-container">
  <!-- DOM Nodes will be dynamically compiled and injected here by the API -->
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Webhook Endpoint defined
    const N8N_WEBHOOK_URL =
      "https://n8n.somsritshirt.com/webhook/2b39d546-37fa-4bc4-8e75-da5532ba5ab0";
    const container = document.querySelector(
      ".pxl-auto-rental-articles-container",
    );

    /**
     * Initializes the asynchronous data fetch and rendering pipeline.
     */
    async function initializeDynamicRows() {
      if (!container) return;

      container.innerHTML =
        '<p class="pxl-loading-state" style="text-align:center; padding: 40px; color: #666; font-family: sans-serif;">Synchronizing fleet data...</p>';

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: "GET",
          headers: {
            Accept: "application/json",
          },
        });

        if (!response.ok)
          throw new Error(`HTTP error! Status: ${response.status}`);

        const rowsData = await response.json();
        renderRows(rowsData);
      } catch (error) {
        console.error(
          "PXL Automation Error: Failed to fetch n8n webhook data.",
          error,
        );
        container.innerHTML =
          '<p class="pxl-error-state" style="color:#d9534f; text-align:center; padding: 40px;">Unable to load content. Please verify webhook connectivity.</p>';
      }
    }

    /**
     * Compiles the DOM structure using Viewport-Aware layout logic.
     * @param {Array} data - Array of article objects.
     */
    function renderRows(data) {
      container.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = "<p>No rental requirements found.</p>";
        return;
      }

      const fragment = document.createDocumentFragment();

      data.forEach((row, index) => {
        const layoutClass = index % 2 === 0 ? "image-left" : "content-left";
        const rowWrapper = document.createElement("div");
        rowWrapper.className = `pxl-rental-row ${layoutClass}`;

        // Build Media Column
        let mediaHtml = "";
        if (row.type === "video") {
          mediaHtml = `
            <div class="media-column">
                <video autoplay muted loop playsinline class="pxl-media-node">
                    <source src="${row.mediaUrl}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>`;
        } else {
          mediaHtml = `
            <div class="media-column">
                <img src="${row.mediaUrl}" alt="${row.title} visual" loading="lazy" class="pxl-media-node" />
            </div>`;
        }

        // Build Details List HTML mapping
        const detailsHtml = row.details
          .map(
            (detail) => `
            <div class="list-item">
                <p class="item-main">${detail.main}</p>
                ${detail.desc ? `<p class="item-desc">${detail.desc}</p>` : ""}
            </div>`,
          )
          .join("");

        // Build Content Column
        const contentHtml = `
            <div class="content-column">
                <h2 class="row-title">${row.title}</h2>
                <div class="details-list">
                    ${detailsHtml}
                </div>
            </div>`;

        // Assemble Row
        if (layoutClass === "image-left") {
          rowWrapper.innerHTML = mediaHtml + contentHtml;
        } else {
          rowWrapper.innerHTML = contentHtml + mediaHtml;
        }

        fragment.appendChild(rowWrapper);
      });

      // Batch DOM insertion to prevent rendering reflows
      container.appendChild(fragment);
    }

    // Execute the pipeline
    initializeDynamicRows();
  });
</script>
