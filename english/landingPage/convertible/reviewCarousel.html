<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
/>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<style>
  /* --- 1. YOUR EXISTING CUSTOM CSS --- */
  .rental-testimonial-bubble {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    display: block;
  }
  .bubble-bg-layer {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
  }
  .bubble-node {
    position: absolute;
    z-index: 10;
    font-family: inherit;
    line-height: 1.4;
  }
  .node-customer-name {
    top: 24%;
    left: 20%;
    font-weight: 700;
    color: #1a1a1a;
    font-size: clamp(12px, 2vw, 18px);
  }
  .node-review-text {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    text-align: center;
    color: #4a4a4a;
    font-size: clamp(14px, 2.5vw, 20px);
  }
  .node-car-name {
    bottom: 28%;
    right: 22%;
    font-weight: 600;
    color: #e88331;
    font-size: clamp(11px, 1.8vw, 15px);
    text-align: right;
  }

  /* --- 2. SWIPER SPECIFIC CSS --- */
  .targa-testimonial-slider {
    width: 100%;
    padding-bottom: 40px;
  }
  .swiper-button-next::after,
  .swiper-button-prev::after {
    color: #e88331;
    font-size: 24px !important;
  }
  .swiper-pagination-bullet-active {
    background-color: #e88331 !important;
  }
  .swiper {
    overflow: hidden;
  }
  .swiper-wrapper {
    display: flex;
    flex-direction: row;
  }
  .swiper-slide {
    flex-shrink: 0;
    width: 100%;
  }
</style>

<div class="swiper targa-testimonial-slider">
  <div class="swiper-wrapper" id="testimonial-container"></div>

  <div class="swiper-pagination"></div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", async function () {
    // 2. Grab the current page language from Polylang (e.g., 'en', 'fr', 'th')
    // This allows you to pass the language to n8n to fetch the correct translated reviews
    const currentLang = document.documentElement.lang.split("-")[0] || "en";

    const wrapper = document.getElementById("testimonial-container");

    const reviewsData = [
      {
        customerName: "คุณ ภัสร์ณลินทร์",
        reviewText:
          "คุณแม่ชมนั่งสบายค่ะ คงได้ใช้บริการบ่อย เจอแต่ร้านที่มีสีขาวหาร้านสีดำยากมาก",
        carName: "Toyota Alphard",
      },
      {
        customerName: "คุณ ต้น ครับ",
        reviewText: "ที่นี่บริการดี ใช้บริการแล้วประทับใจครับ",
      },
      {
        customerName: "คุณ Kai Jeaw",
        reviewText:
          "เช่ามารอบที่สองแล้ว ดูแลดีมากๆ ประทับใจทุกขั้นตอน มีปัญหาอะไรโทรหรือปรึกษาแอดมินได้ตลอดเวลา ดีมากๆแนะนำเลยค่ะ",
        carName: "Porsch 718 Boxster",
      },
      {
        customerName: "คุณ Thant Sin",
        reviewText: "Should Tryyy ,Really Recommend !!",
      },
      {
        customerName: "คุณ Songjin Arkit",
        reviewText: "รถดีเยี่ยมมากครับพนักงานบริการดีและเป็นกันเองตอนส่งมอบรถ",
        carName: "Mercedes-Benz C300 Convertible",
      },
      {
        customerName: "คุณ Ffn LS",
        reviewText:
          "ตั้งแต่ใช้บริการมาบริการดีมากครับไม่ว่าจะเป็นตอนส่งรถหรือรับรถทุกอย่างดูเหมือนมืออาชีพและบริการเป็นอย่างดีแถมผมเป็นลูกค้าที่ชอบการบริการแบบนี้มากรู็สึกปลื้มใจมากครับที่ได้ใช้บริการที่นี้ คุ้มค่าและจัดส่งทางไกลได้ตลอด",
        carName: "BMW 320D LCI",
      },
      {
        customerName: "คุณ Miw Wongsiyakul",
        reviewText:
          "พนักงานทุกท่านให้บริการดีมากค่ะ รถสวยและใหม่มาก กลับมาใช้บริการอีกแน่นอนค่ะ",
        carName: "Mercedes-Benz C300 Convertible",
      },
      {
        customerName: "คุณ Ome Let",
        reviewText:
          "แอดมินดูแลดีมาก ทางร้านติดขัดปัญหาตรงไหนแก้ไขกันได้ดีสุดๆ รถขับดีมาก",
      },
      {
        customerName: "คุณ Oat Boonlai",
        reviewText: "ขับดีมากๆครับผม รถคุณภาพ",
        carName: "Toyota alphard",
      },
    ];

    // 4. Map the JSON payload to the DOM architecture
    let slidesHTML = "";
    reviewsData.forEach((review) => {
      slidesHTML += `
          <div class="swiper-slide">
            <div class="rental-testimonial-bubble">
              <img src="https://targacar.com/wp-content/uploads/commentCard4.png" class="bubble-bg-layer" />
              <div class="bubble-node node-customer-name">${review.customerName}</div>
              <div class="bubble-node node-review-text">"${review.reviewText}"</div>
              <div class="bubble-node node-car-name">${review.carName ?? ""}</div>
            </div>
          </div>
        `;
    });

    // 5. Inject the raw HTML string into the DOM
    wrapper.innerHTML = slidesHTML;

    // 6. Initialize the Swiper calculation engine
    const initTargaSwiper = () => {
      if (typeof Swiper !== "undefined") {
        new Swiper(".targa-testimonial-slider", {
          loop: true,
          slidesPerView: 1,
          spaceBetween: 20,
          autoplay: { delay: 5000, disableOnInteraction: false },
          pagination: { el: ".swiper-pagination", clickable: true },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
        });
      } else {
        setTimeout(initTargaSwiper, 50);
      }
    };

    initTargaSwiper();
  });
</script>
