<style>
  /* --- 1. CSS VARIABLES & THEME --- */
  :root {
    --gallery-grid-gap: 20px;
    --gallery-border-radius: 6px;
    --gallery-text-primary: #1a1a1a;
    --gallery-text-accent: #b26e35; /* Earthy orange matching the design */
    --gallery-bg-skeleton: #e5e7eb;
  }

  /* --- 2. LAYOUT & TYPOGRAPHY --- */
  .rc-gallery-section {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    font-family: inherit; /* Inherits from Elementor global fonts */
    box-sizing: border-box;
    /* Mobile First: Generous padding on all sides to prevent edge-touching */
    padding: 40px 20px;
  }

  .rc-gallery-header {
    margin-bottom: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .rc-gallery-subtitle {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gallery-text-accent);
    display: block;
  }

  .rc-gallery-heading {
    font-size: clamp(1.75rem, 4vw, 2.25rem);
    font-weight: 600;
    color: var(--gallery-text-primary);
    margin: 0;
    line-height: 1.2;
  }

  /* --- 3. CSS GRID ARCHITECTURE (MOBILE CAROUSEL FIRST) --- */
  .rc-gallery-grid {
    display: grid;
    /* Mobile First: Horizontal Scroll Carousel */
    grid-auto-flow: column;
    grid-auto-columns: 85%; /* Next image peeks in to indicate scrollability */
    gap: 16px;
    padding: 0 0 20px 0; /* Bottom padding for scroll area */
    margin: 0;
    list-style: none;

    /* Native App-like Swipe Physics */
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scrollbar-width: none; /* Firefox: hide scrollbar */
  }

  /* Hide scrollbar for Chrome/Safari but keep functionality */
  .rc-gallery-grid::-webkit-scrollbar {
    display: none;
  }

  /* Tablet */
  @media (min-width: 768px) {
    .rc-gallery-section {
      padding: 80px 40px;
    }
    .rc-gallery-grid {
      grid-auto-flow: row; /* Revert to vertical grid */
      grid-template-columns: repeat(2, 1fr);
      overflow-x: visible;
      scroll-snap-type: none;
      padding-bottom: 0;
    }
  }

  /* Desktop */
  @media (min-width: 1024px) {
    .rc-gallery-section {
      padding: 120px 20px; /* Substantial top/bottom padding for premium desktop feel */
    }
    .rc-gallery-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* --- 4. ITEM & ASSET HANDLING (CLS PREVENTION) --- */
  .rc-gallery-item {
    position: relative;
    margin: 0;
    padding: 0;
    aspect-ratio: 1 / 1;
    border-radius: var(--gallery-border-radius);
    overflow: hidden;
    background-color: var(--gallery-bg-skeleton);

    /* Mobile Carousel Snapping Point */
    scroll-snap-align: center;

    /* Hardware Acceleration Preparation */
    transform: translateZ(0);
    will-change: transform, opacity;

    /* Initial state for IntersectionObserver reveal */
    opacity: 0;
    transform: translateY(40px);
    transition:
      opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Disable snapping on larger screens where it is a static grid */
  @media (min-width: 768px) {
    .rc-gallery-item {
      scroll-snap-align: none;
    }
  }

  .rc-gallery-item.is-revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .rc-gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;

    /* Micro-interaction hover state */
    will-change: transform;
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Apply object-position directly to the img tag inside the extra-image figure */
  .rc-gallery-item.extra-image img {
    object-position: center bottom !important;
  }

  .rc-gallery-item:hover img {
    transform: scale(1.04);
  }
</style>

<!-- --- VANILLA JS PERFORMANCE ANIMATION --- -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Highly performant IntersectionObserver to handle scroll-reveals
    const revealItems = document.querySelectorAll(".rc-gallery-item");

    // Check if IntersectionObserver is supported (fallback for very old browsers)
    if (!("IntersectionObserver" in window)) {
      revealItems.forEach((item) => item.classList.add("is-revealed"));
      return;
    }

    const observerOptions = {
      root: null, // viewport
      rootMargin: "0px 0px -10% 0px", // Trigger slightly before the item hits the bottom
      threshold: 0.1, // 10% of the item must be visible
    };

    const galleryObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          // Add class to trigger CSS transition
          // We use requestAnimationFrame to ensure it aligns with the browser's render cycle
          window.requestAnimationFrame(() => {
            entry.target.classList.add("is-revealed");
          });
          // Stop observing once revealed to save memory
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    // Initial staggering application for load (calculates delay based on node index)
    revealItems.forEach((item, index) => {
      // Adding a slight inline transition delay based on grid order for a cascading effect
      item.style.transitionDelay = `${(index % 3) * 0.15}s`;
      galleryObserver.observe(item);
    });
  });
</script>
