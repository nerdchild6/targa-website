<style>
  :root {
    --supp-site-font: "Poppins", "Inter", "Fredoka", sans-serif;
    --brand-accent: #e67e22;
  }

  .hero-optimized {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 100vh;
    padding: 0 5%;
    font-family: var(--supp-site-font);
    overflow: hidden;
  }

  /* --- Keyframe Animations --- */
  @keyframes fadeInUp {
    0% {
      opacity: 0;
      transform: translateY(30px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes cinematicZoom {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(1.08);
    }
  }

  .hero-optimized__bg {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;

    /* WordPress Theme Reset */
    display: block !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;

    /* Kept the fixed layout alignment from previous iteration */
    object-fit: cover !important;
    object-position: center bottom !important;
    z-index: 1 !important;

    /* Apply cinematic zoom effect (GPU Accelerated) */
    animation: cinematicZoom 25s linear infinite alternate;
    transform-origin: center bottom;
  }

  .hero-optimized__pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(
      rgba(255, 255, 255, 0.15) 1px,
      transparent 1px
    );
    background-size: 24px 24px;
    background-color: rgba(0, 0, 0, 0.2);
    z-index: 2;
  }

  .hero-optimized__content {
    position: relative;
    z-index: 3;
    max-width: 800px;
    color: #ffffff !important;
  }

  .hero-optimized__title {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 1rem;
    color: #ffffff !important;

    /* Animation implementation */
    opacity: 0;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.2s;
  }

  .hero-optimized__title span {
    color: var(--brand-accent);
  }

  .hero-optimized__desc {
    font-size: 1.125rem;
    line-height: 1.6;
    margin-bottom: 2rem;
    max-width: 600px;

    /* Animation implementation */
    opacity: 0;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.4s;
  }

  .hero-optimized__btn {
    display: inline-block;
    padding: 14px 32px;
    font-size: small;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 8px;

    /* User's Gradient Styles */
    background: linear-gradient(
      to right,
      #9b4c03 0%,
      #e7802d 50%,
      #9b4c03 100%
    ) !important;
    background-size: 200% auto !important;
    color: #ffffff !important;
    box-shadow: 0 10px 20px rgba(207, 115, 33, 0.2);

    /* Animation implementation */
    opacity: 0;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: 0.6s;

    /* Transition for hover state */
    transition:
      transform 0.3s ease,
      background-position 0.3s ease,
      box-shadow 0.3s ease;
  }

  .hero-optimized__btn:hover {
    transform: scale(1.05) translateY(-2px);
    background-position: right center !important;
    box-shadow: 0 15px 25px rgba(207, 115, 33, 0.3);
  }
</style>

<!-- JSON-LD SEO Structured Data -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AutoRental",
    "name": "Targa Car",
    "url": "https://targacar.com",
    "image": "https://targacar.com/wp-content/uploads/hero-1-scaled.jpg",
    "description": "Experience world-class supercar rental. Curated for those who demand excellence and performance in every mile.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "TH"
    },
    "priceRange": "$$$$"
  }
</script>

<section class="hero-optimized">
  <!-- Inline styles applied to prevent theme overrides on the background -->
  <img
    src="https://targacar.com/wp-content/uploads/hero-1-scaled.jpg"
    alt="Premium supercar rental fleet"
    class="hero-optimized__bg"
    fetchpriority="high"
    style="
      object-position: center bottom !important;
      object-fit: cover !important;
    "
  />
  <div class="hero-optimized__pattern"></div>
  <div class="hero-optimized__content">
    <h1 class="hero-optimized__title">Drive the <span>Extraordinary</span></h1>
    <p class="hero-optimized__desc">
      Experience world-class supercar rental. Curated for those who demand
      excellence and performance in every mile.
    </p>
    <a href="/gallery" class="hero-optimized__btn" id="heroGalleryBtn"
      >Explore Gallery</a
    >
  </div>
</section>
