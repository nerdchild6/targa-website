<style>
  /* --- BASE CONTAINER --- */
  .pxl-custom-blog-wrapper {
    font-family: "Prompt", sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    margin-top: 20vh;
    width: 100%;
    box-sizing: border-box;
  }

  /* --- GRID ARCHITECTURE --- */
  .pxl-blog-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    column-gap: 40px;
    row-gap: 50px;
    margin-bottom: 50px;
  }

  /* Responsive Breakpoint */
  @media (max-width: 768px) {
    .pxl-blog-grid {
      grid-template-columns: 1fr;
    }
  }

  /* --- CARD COMPONENT --- */
  .pxl-blog-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    cursor: pointer;
  }

  .pxl-blog-card:hover .pxl-img-element {
    transform: scale(1.05);
  }

  /* Image Aspect Ratio Container (16:9) */
  .pxl-img-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 Aspect Ratio */
    overflow: hidden;
    margin-bottom: 20px;
    background-color: #f0f0f0;
  }

  .pxl-img-element {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* Meta Data (Date) */
  .pxl-blog-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #555;
    margin-bottom: 12px;
    font-weight: 400;
  }

  .pxl-blog-meta svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* Typography */
  .pxl-blog-title {
    font-size: 20px;
    font-weight: 500;
    color: #1a1a1a;
    line-height: 1.4;
    margin: 0 0 15px 0;
    transition: color 0.3s ease;
  }

  .pxl-blog-card:hover .pxl-blog-title {
    color: #c5a880; /* Hover color derived from your pagination active state */
  }

  .pxl-blog-excerpt {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin: 0;
    font-weight: 300;
    /* Truncate text after 3 lines */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* --- PAGINATION CONTROLS --- */
  .pxl-pagination-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    align-items: center;
    margin-top: 20px;
  }

  .pxl-page-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 35px;
    height: 35px;
    padding: 0 10px;
    border: 1px solid #ddd;
    background: transparent;
    color: #333;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pxl-page-btn:hover {
    border-color: #c5a880;
    color: #c5a880;
  }

  .pxl-page-btn.active {
    background-color: #c5a880;
    border-color: #c5a880;
    color: #fff;
  }

  .pxl-page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>

<div class="pxl-custom-blog-wrapper">

</div>

  /**
   * State Management
   */
  const state = {
    currentPage: 1,
    itemsPerPage: 8, // Set to 8 to match your design screenshot
    totalItems: blogData.length,
  };

  /**
   * SVG Icon Asset
   */
  const calendarIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 4H18V2H16V4H8V2H6V4H5C3.89 4 3.01 4.9 3.01 6L3 20C3 21.1 3.89 22 5 22H19C20.1 22 21 21.1 21 20V6C21 4.9 20.1 4 19 4ZM19 20H5V10H19V20ZM19 8H5V6H19V8ZM9 14H7V12H9V14ZM13 14H11V12H13V14ZM17 14H15V12H17V14ZM9 18H7V16H9V18ZM13 18H11V16H13V18ZM17 18H15V16H17V18Z"/></svg>`;

  /**
   * DOM Elements
   */
  const gridTarget = document.getElementById("pxl-blog-grid-target");
  const paginationTarget = document.getElementById("pxl-pagination-target");

  /**
   * Core Render Function for the Grid
   */
  function renderGrid(page) {
    gridTarget.innerHTML = ""; // Clear existing DOM

    // Calculate pagination slice
    const startIndex = (page - 1) * state.itemsPerPage;
    const endIndex = startIndex + state.itemsPerPage;
    const paginatedItems = blogData.slice(startIndex, endIndex);

    // Document Fragment for performance optimization
    const fragment = document.createDocumentFragment();

    paginatedItems.forEach((post) => {
      const article = document.createElement("a");
      article.href = post.url;
      article.className = "pxl-blog-card";

      article.innerHTML = `
        <div class="pxl-img-wrapper">
          <img src="${post.image}" alt="${post.title}" class="pxl-img-element" loading="lazy">
        </div>
        <div class="pxl-blog-meta">
          ${calendarIcon}
          <span>${post.date}</span>
        </div>
        <h3 class="pxl-blog-title">${post.title}</h3>
        <p class="pxl-blog-excerpt">${post.excerpt}</p>
      `;

      fragment.appendChild(article);
    });

    gridTarget.appendChild(fragment);
  }

  /**
   * Core Render Function for Pagination Controls
   */
  function renderPagination() {
    paginationTarget.innerHTML = ""; // Clear existing DOM

    const totalPages = Math.ceil(state.totalItems / state.itemsPerPage);
    if (totalPages <= 1) return; // Do not render if only 1 page

    // Previous Button
    const prevBtn = document.createElement("button");
    prevBtn.className = "pxl-page-btn";
    prevBtn.innerHTML = "&lsaquo;";
    prevBtn.disabled = state.currentPage === 1;
    prevBtn.addEventListener("click", () => changePage(state.currentPage - 1));
    paginationTarget.appendChild(prevBtn);

    // Numbered Buttons
    for (let i = 1; i <= totalPages; i++) {
      const pageBtn = document.createElement("button");
      pageBtn.className = `pxl-page-btn ${i === state.currentPage ? "active" : ""}`;
      pageBtn.innerText = i;
      pageBtn.addEventListener("click", () => changePage(i));
      paginationTarget.appendChild(pageBtn);
    }

    // Next Button
    const nextBtn = document.createElement("button");
    nextBtn.className = "pxl-page-btn";
    nextBtn.innerHTML = "&rsaquo;";
    nextBtn.disabled = state.currentPage === totalPages;
    nextBtn.addEventListener("click", () => changePage(state.currentPage + 1));
    paginationTarget.appendChild(nextBtn);
  }

  /**
   * State Mutation and Re-render
   */
  function changePage(newPage) {
    const totalPages = Math.ceil(state.totalItems / state.itemsPerPage);
    if (newPage < 1 || newPage > totalPages) return;

    state.currentPage = newPage;
    renderGrid(state.currentPage);
    renderPagination();

    // Smooth scroll back to top of grid
    gridTarget.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /**
   * Initialize App
   */
  document.addEventListener("DOMContentLoaded", () => {
    renderGrid(state.currentPage);
    renderPagination();
  });
</script>
