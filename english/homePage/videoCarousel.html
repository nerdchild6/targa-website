<style>
  /* --- CSS Architecture: Light Orange Cream Theme (Portrait 9:16) --- */
  .rcms-carousel-wrapper {
    position: relative;
    width: 100%;
    height: 800px; /* Increased to accommodate taller vertical cards */
    display: flex;
    justify-content: center;
    align-items: center;
    /* Matches your website's light background */
    background: radial-gradient(circle at center, #ffffff 0%, #f7f4f0 100%);
    overflow: hidden;
    /* Establishes the 3D coordinate space */
    perspective: 1200px;
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;
  }

  .rcms-carousel-scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  .rcms-card {
    position: absolute;
    /* Narrower width for optimal 9:16 presentation */
    width: 320px;
    border-radius: 24px;
    /* Light Glassmorphism parameters */
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(241, 138, 59, 0.15); /* Orange tint border */
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);

    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: pointer;

    /* Hardware accelerated transitions */
    transition:
      transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
      filter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
      z-index 0.6s step-end;

    /* Initialize CSS variables for JS manipulation */
    --offset: 0;
    --abs-offset: 0;

    /* Adjusted translateX distance for narrower vertical cards */
    transform: translateX(calc(var(--offset) * 150px))
      translateZ(calc(var(--abs-offset) * -200px))
      rotateY(calc(var(--offset) * -20deg));

    opacity: calc(1 - var(--abs-offset) * 0.3);
    z-index: calc(10 - var(--abs-offset));
    filter: blur(calc(var(--abs-offset) * 3px));
  }

  /* Active state enhancement - Orange Theme */
  .rcms-card.is-active {
    border-color: rgba(241, 138, 59, 0.6);
    box-shadow:
      0 0 40px rgba(241, 138, 59, 0.15),
      inset 0 0 20px rgba(241, 138, 59, 0.05);
  }

  /* Card Internal UI Structure */
  .rcms-card-header {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  }

  .rcms-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    /* Orange gradient mapping to website brand */
    background: linear-gradient(135deg, #f18a3b, #d97020);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    font-size: 12px;
  }

  .rcms-meta {
    color: #718096; /* Darker grey for light theme readability */
    font-size: 12px;
  }

  .rcms-meta strong {
    color: #2d3748;
    display: block;
    font-size: 14px;
  }

  /* Enforcing the 9:16 Portrait ratio */
  .rcms-card-media {
    width: 100%;
    aspect-ratio: 9 / 16;
    position: relative;
    background: #e2e8f0; /* Soft grey loading background */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rcms-card-media video {
    width: 100%;
    height: 100%;
    /* Cover fills the vertical space edge-to-edge beautifully */
    object-fit: cover;
    background: #000;
  }

  .rcms-card-footer {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    color: #718096;
    font-size: 14px;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
  }

  /* Carousel Controls */
  .rcms-controls {
    position: absolute;
    bottom: 20px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }

  .rcms-btn {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(241, 138, 59, 0.3);
    color: #f18a3b;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    font-weight: bold;
  }

  .rcms-btn:hover {
    background: #f18a3b;
    color: white;
    border-color: #f18a3b;
  }
</style>

<!-- --- HTML DOM Structure --- -->
<div class="rcms-carousel-wrapper">
  <div class="rcms-carousel-scene" id="rcmsScene">
    <!-- Cards will be dynamically injected here by JS fetching from n8n -->
  </div>

  <!-- Navigation Constraints -->
  <div class="rcms-controls">
    <button class="rcms-btn" id="rcmsPrev">❮</button>
    <button class="rcms-btn" id="rcmsNext">❯</button>
  </div>
</div>

<!-- --- JavaScript Logic (With n8n Webhook Integration) --- -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scene = document.getElementById("rcmsScene");
    const prevBtn = document.getElementById("rcmsPrev");
    const nextBtn = document.getElementById("rcmsNext");

    let activeIndex = 0;
    let cards = [];

    const fleetData = [
      {
        id: "LUX",
        title: "Luxury Fleet",
        handle: "@targa_luxury",
        videoUrl:
          "https://targacar.com/wp-content/uploads/Video-981x718-home.mov",
        comments: 12,
        shares: 4,
        likes: 89,
      },
      {
        id: "SPR",
        title: "Supercar Series",
        handle: "@targa_super",
        videoUrl:
          "https://targacar.com/wp-content/uploads/Video-all-car-home.mov",
        comments: 45,
        shares: 12,
        likes: 210,
      },
      {
        id: "EXO",
        title: "Exotic Rentals",
        handle: "@targa_exotic",
        videoUrl:
          "https://targacar.com/wp-content/uploads/Video-all-supercar-home.mov",
        comments: 128,
        shares: 56,
        likes: 1200,
      },
      {
        id: "LUX",
        title: "Luxury Fleet",
        handle: "@targa_luxury",
        videoUrl:
          "https://targacar.com/wp-content/uploads/Video-maserati-home.mov",
        comments: 12,
        shares: 4,
        likes: 89,
      },
      {
        id: "SPR",
        title: "Supercar Series",
        handle: "@targa_super",
        videoUrl:
          "https://targacar.com/wp-content/uploads/Video-supercar-parking-home.mov",
        comments: 45,
        shares: 12,
        likes: 210,
      },
      {
        id: "EXO",
        title: "Exotic Rentals",
        handle: "@targa_exotic",
        videoUrl: "https://targacar.com/wp-content/uploads/Video-z4-home.mov",
        comments: 128,
        shares: 56,
        likes: 1200,
      },
    ];

    // 2. DOM Hydration Engine
    function renderCarouselDOM(fleetData) {
      scene.innerHTML = fleetData
        .map(
          (item, index) => `
                <div class="rcms-card" data-index="${index}">
                    <div class="rcms-card-header">
                        <div class="rcms-avatar">${item.id}</div>
                        <div class="rcms-meta">
                            <strong>${item.title}</strong>
                            ${item.handle}
                        </div>
                    </div>
                    <div class="rcms-card-media">
                        <!-- Removed 'loop' attribute so 'ended' event can fire -->
                        <video muted playsinline>
                            <source src="${item.videoUrl}" type="video/quicktime">
                            <source src="${item.videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <div class="rcms-card-footer">
                        <div class="rcms-footer-icon">💬 ${item.comments || 0}</div>
                        <div class="rcms-footer-icon">🔄 ${item.shares || 0}</div>
                        <div class="rcms-footer-icon">❤️ ${item.likes || 0}</div>
                    </div>
                </div>
            `,
        )
        .join("");

      // Re-select newly injected DOM nodes
      cards = document.querySelectorAll(".rcms-card");

      // Set initial active index to middle item if enough exist, otherwise 0
      activeIndex = Math.floor(cards.length / 2);

      bindEvents();
      updateCarousel();
    }

    // 3. Core 3D Transformation Engine
    function updateCarousel() {
      const totalCards = cards.length;
      if (totalCards === 0) return;

      cards.forEach((card, index) => {
        const offset = index - activeIndex;
        const absOffset = Math.abs(offset);

        // Hardware-accelerated transforms mapping
        card.style.setProperty("--offset", offset);
        card.style.setProperty("--abs-offset", absOffset);

        // Handle Active Video State memory management and Auto-Advance
        if (offset === 0) {
          card.classList.add("is-active");
          const vid = card.querySelector("video");
          if (vid) {
            vid.play().catch((e) => console.log("Autoplay blocked:", e));

            // Reversed: automatically advance to previous slide when video finishes (endless loop left to right)
            vid.onended = () => {
              activeIndex = (activeIndex - 1 + totalCards) % totalCards;
              updateCarousel();
            };
          }
        } else {
          card.classList.remove("is-active");
          const vid = card.querySelector("video");
          if (vid) {
            vid.pause();
            vid.currentTime = 0; // Reset inactive videos to start
            vid.onended = null; // Clean up listener
          }
        }
      });
    }

    // 4. Event Binding Layer
    function bindEvents() {
      const totalCards = cards.length;

      // Updated Next/Prev logic for endless wrap-around
      nextBtn.onclick = () => {
        activeIndex = (activeIndex + 1) % totalCards;
        updateCarousel();
      };

      prevBtn.onclick = () => {
        activeIndex = (activeIndex - 1 + totalCards) % totalCards;
        updateCarousel();
      };

      cards.forEach((card, index) => {
        card.onclick = () => {
          activeIndex = index;
          updateCarousel();
        };
      });
    }

    // Execute initialization
    renderCarouselDOM(fleetData);
  });
</script>
