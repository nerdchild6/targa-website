    function render3DCarousel(carData) {
      carouselContainer.innerHTML = "";
      carouselContainer.classList.remove("loading");

      const track = document.createElement("div");
      track.classList.add("three-D-carousel-track");

      if (carData.length === 1) {
        track.classList.add("single-item");
      }

      carData.forEach((car) => {
        track.appendChild(create3DCard(car));
      });

      carouselContainer.appendChild(track);
    }

    function create3DCard(car) {
      const card = document.createElement("a");
      card.classList.add("three-D-hover-car-carousel-card");
      card.href = car.link || "#";
      card.style.textDecoration = "none";

      const coverImg =
        car.coverImage ||
        "https://targacar.com/wp-content/uploads/card-scaled.jpeg";

      const logoImage =
        car.logoImage ?? "https://targacar.com/wp-content/uploads/popup-1.png";

      const carName = car.carName || "Ferrari 488";
      const carBrand = car.carBrand || "Ferrari";

      const currency = car.currency || "฿";
      const amount = car.amount || "0";
      const duration = car.perDay || "/ day";

      card.innerHTML = `
        <div class="three-D-hover-car-carousel-wrapper">
          <img src="${coverImg}" class="three-D-hover-car-carousel-cover-image" />
        </div>

      <img src="${logoImage}" class="three-D-hover-car-carousel-logo" />
        
        <h2 class="three-D-hover-car-carousel-character-text">${carName}</h2>
        <h3 class="three-D-hover-car-carousel-logo-text">${carBrand}</h3>
        
        <div class="three-D-hover-car-carousel-price-layout">
          <span class="three-D-hover-car-carousel-currency">${currency}</span>
          <span class="three-D-hover-car-carousel-amount">${amount}</span>
          <span class="three-D-hover-car-carousel-per-day">${duration}</span>
        </div>
      `;
      return card;
    }

    function initializeReverseSynchronization() {
      const track = document.querySelector(".three-D-carousel-track");
      if (!track) return;

      const cards = track.querySelectorAll(".three-D-hover-car-carousel-card");
      if (cards.length < 2) return;

      let autoScrollInterval;
      const AUTO_SCROLL_DELAY_MS = 3500;

      track.scrollLeft = track.scrollWidth;

      const advanceCarousel = () => {
        const scrollAmount = cards[1].offsetLeft - cards[0].offsetLeft;

        if (track.scrollLeft <= 5) {
          track.scrollTo({ left: track.scrollWidth, behavior: "smooth" });
        } else {
          track.scrollBy({ left: -scrollAmount, behavior: "smooth" });
        }
      };

      const startAutoScroll = () => {
        clearInterval(autoScrollInterval);
        autoScrollInterval = setInterval(advanceCarousel, AUTO_SCROLL_DELAY_MS);
      };

      const stopAutoScroll = () => {
        clearInterval(autoScrollInterval);
      };

      startAutoScroll();

      track.addEventListener("mouseenter", stopAutoScroll);
      track.addEventListener("mouseleave", startAutoScroll);
      track.addEventListener("touchstart", stopAutoScroll, { passive: true });
      track.addEventListener("touchend", startAutoScroll, { passive: true });
    }

    requestAnimationFrame(() =>
      setTimeout(initializeReverseSynchronization, 100),
    );
