<script>
  window.addEventListener("load", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const requestedFilters = [];

    // 1. Map requested parameters
    const brandParam = urlParams.get("brand");
    if (brandParam) {
      requestedFilters.push({
        value: brandParam,
        selector: 'input.vehicle-brands[type="checkbox"]',
      });
    }

    const categoryParam = urlParams.get("vehicleCategories");
    if (categoryParam) {
      requestedFilters.push({
        value: categoryParam,
        selector: 'input.vehicle-category[type="checkbox"]',
      });
    }

    if (requestedFilters.length === 0) return; // Exit if no parameters

    // 2. Synchronized Dynamic Polling
    const maxRetries = 40;
    let attempts = 0;

    const hydrationInterval = setInterval(() => {
      attempts++;

      // ARCHITECTURAL FIX: Strict Dynamic Node Validation
      // Evaluates every requested filter to ensure PXL has fully injected the specific checkbox arrays
      // into the DOM. This prevents firing the payload during PXL's internal Isotope/Masonry initialization.
      const allNodesHydrated = requestedFilters.every((filter) => {
        return document.querySelectorAll(filter.selector).length > 0;
      });

      if (allNodesHydrated) {
        clearInterval(hydrationInterval);

        // 3. Execution Buffer (800ms post-node hydration)
        setTimeout(() => {
          let scrollTarget = null;

          // 4. Dispatch Synthetic Interactions
          requestedFilters.forEach((filter) => {
            const checkboxes = document.querySelectorAll(filter.selector);

            for (const checkbox of checkboxes) {
              const label = checkbox.closest("label");

              // IMPROVEMENT: Case-insensitive matching for better URL reliability
              if (label) {
                const labelText = label.textContent.trim().toLowerCase();
                const paramValue = filter.value.trim().toLowerCase();

                if (labelText === paramValue) {
                  // Prevent redundant toggling and execute vanilla click
                  if (!label.classList.contains("active")) {
                    label.click();
                  }

                  // Capture the viewport alignment target
                  if (!scrollTarget) {
                    scrollTarget = label.closest(
                      "div.pxl-car-listing-wg, ul.list-item",
                    );
                  }
                  break;
                }
              }
            }
          });

          // 5. Execute unified UI viewport alignment
          if (scrollTarget) {
            scrollTarget.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 800);
      } else if (attempts >= maxRetries) {
        clearInterval(hydrationInterval);
        console.error(
          "PXL Filter Hydration Timeout: Dynamic checkbox nodes failed to render within execution window.",
        );
      }
    }, 250);
  });
</script>
