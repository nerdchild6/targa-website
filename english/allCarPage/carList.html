<style>
  :root {
    --card-bg: #ffffff;
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    --border-color: #eaeaea;
    --accent: #d4af37;
    --transition-curve: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .targa-grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    width: 100%;
    margin: 0 auto;
  }

  .targa-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition:
      transform var(--transition-curve),
      box-shadow var(--transition-curve);
    will-change: transform; /* Optimizes composite layers */
  }

  .targa-card:hover {
    transform: translateY(-6px);
    box-shadow:
      0 12px 24px rgba(0, 0, 0, 0.08),
      0 4px 8px rgba(0, 0, 0, 0.04);
  }

  .targa-card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10; /* Enforces strict dimensions to prevent reflow */
    overflow: hidden;
    background-color: #f8f9fa;
  }

  .targa-card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures images fill the ratio without distortion */
    transition: transform 0.5s ease;
  }

  .targa-card:hover .targa-card-media img {
    transform: scale(1.05);
  }

  .targa-tags {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 2;
  }

  .targa-tag {
    background: rgba(15, 15, 15, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .targa-card-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .targa-title {
    font-size: 1.25rem;
    color: var(--text-primary);
    margin: 0 0 16px 0;
    font-weight: 500;
    line-height: 1.3;
  }

  .targa-footer {
    margin-top: auto; /* Forces footer to the bottom of the flex container */
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 16px;
  }

  .targa-price {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .targa-price span {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .targa-cta {
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 500;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s ease;
  }

  .targa-cta:hover {
    color: var(--accent);
  }

  .targa-cta::after {
    content: "→";
    transition: transform 0.2s ease;
  }

  .targa-cta:hover::after {
    transform: translateX(4px);
  }
</style>

<section
  id="vehicle-inventory-grid"
  class="targa-grid-container"
  aria-label="Available Rental Vehicles"
>
  <div class="targa-loading-skeleton">Initializing inventory...</div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const gridContainer = document.getElementById("vehicle-inventory-grid");

    // 1. Polylang Integration: Detect active locale from the HTML tag
    const currentLocale = document.documentElement.lang || "en-US";

    // 2. n8n Webhook Endpoint
    // This expects a GET request, appending the locale as a query parameter
    const n8nEndpoint = `https://n8n.somsritshirt.com/webhook/4bd0dec9-a3d9-4259-837a-f60277457267?lang=${currentLocale}`;

    async function fetchInventory() {
      try {
        const response = await fetch(n8nEndpoint, {
          method: "GET",
          headers: { Accept: "application/json" },
        });

        if (!response.ok)
          throw new Error(`HTTP error! status: ${response.status}`);

        const vehicles = await response.json();
        renderGrid(vehicles);
      } catch (error) {
        console.error("Failed to hydrate inventory:", error);
        gridContainer.innerHTML = `<p style="color:red;">Unable to load inventory. Please try again later.</p>`;
      }
    }

    function renderGrid(vehicles) {
      // Use DocumentFragment to minimize browser reflows during DOM injection
      const fragment = document.createDocumentFragment();

      vehicles.forEach((car) => {
        const article = document.createElement("article");
        article.className = "targa-card";

        // Map the tags array to HTML strings
        const tagsHTML = car.tags
          .map((tag) => `<span class="targa-tag">${tag}</span>`)
          .join("");

        article.innerHTML = `
                <div class="targa-card-media">
                    <div class="targa-tags">${tagsHTML}</div>
                    <img src="${car.imageUrl}" alt="${car.title}" loading="lazy" />
                </div>
                <div class="targa-card-body">
                    <h3 class="targa-title">${car.title}</h3>
                    <div class="targa-footer">
                        <div class="targa-price">${car.priceFormatted} <span>/ day</span></div>
                        <a href="${car.detailsUrl}" class="targa-cta">View Details</a>
                    </div>
                </div>
            `;
        fragment.appendChild(article);
      });

      // Clear skeleton and inject the fragment
      gridContainer.innerHTML = "";
      gridContainer.appendChild(fragment);
    }

    // Initialize
    fetchInventory();
  });
</script>
