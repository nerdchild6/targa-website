<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>3D Card Hover Effect Using HTML CSS Only</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Main Card Code -->
    <div class="card">
      <!-- Cover image Code -->
      <div class="wrapper">
        <img src="card.jpeg" class="cover-image" />
      </div>

      <!-- Logo Code -->
      <img src="popup.png" class="logo" />

      <!-- Character image Code -->
      <img src="text.png" class="character" />
    </div>
  </body>
</html>
